version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexopos_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexopos_db}
    volumes:
      - ./postgres_data_v15:/var/lib/postgresql/data
    networks:
      - nexopos_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
      network: host
    container_name: nexopos_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexopos_db}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      TZ: America/Santiago
      CORS_ORIGINS: "https://nexopos.cl,https://www.nexopos.cl,http://localhost:3000,http://localhost:5173"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - nexopos_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      network: host
    container_name: nexopos_web
    restart: always
    ports:
      - "127.0.0.1:3000:80" # Exposed only to localhost for cPanel reverse proxy
    depends_on:
      - api
    networks:
      - nexopos_network

networks:
  nexopos_network:
    driver: bridge
