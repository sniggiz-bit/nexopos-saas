# Canonicalize marketing pages without moving installed POS clients, API calls,
# storefront carts, update metadata or Google ownership files across origins.
map $uri $public_marketing_page {
    default 0;
    "/" 1;
    ~^/(landing|contacto|soporte|terminos|privacidad)/?$ 1;
}
map "$host:$public_marketing_page" $redirect_www_host {
    default 0;
    "www.nexopos.cl:1" 1;
}
map "$http_x_forwarded_host:$public_marketing_page" $redirect_www_forwarded {
    default 0;
    "www.nexopos.cl:1" 1;
}
map $upstream_http_content_type $api_robots_tag {
    default "noindex, follow";
    ~*^image/ "";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Canonical host. Keep local release-check hosts working.
    if ($redirect_www_host) { return 301 https://nexopos.cl$request_uri; }
    if ($redirect_www_forwarded) { return 301 https://nexopos.cl$request_uri; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    error_page 404 /404.html;

    location = / { try_files /index.html =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
    location ~ ^/landing/?$ { return 301 /$is_args$args; }
    # Workbox must be able to precache this document on the client's own origin.
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
    location ~ ^/(contacto|soporte|terminos|privacidad|login|register)/index\.html$ { return 301 /$1$is_args$args; }
    location ~ ^/(contacto|soporte|terminos|privacidad|login|register)/$ { return 301 /$1$is_args$args; }

    location ~ ^/(login|register)$ {
        try_files $uri/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location ~ ^/(contacto|soporte|terminos|privacidad)$ {
        try_files $uri/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location ~ ^/(dashboard|admin|pos|auth|reset-password)(/|$) {
        try_files /app-shell.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location ~ ^/store/[^/]+/?$ {
        try_files /store-shell.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /store-shell.html { internal; }
    location = /app-shell.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location = /robots.txt { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location = /sitemap.xml { try_files $uri =404; add_header Cache-Control "no-cache" always; }

    # Keep installed POS clients able to discover new releases.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location = /sw.js { add_header Cache-Control "no-store, no-cache, must-revalidate" always; }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;
    location ^~ /api/events/stream {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        add_header X-Robots-Tag $api_robots_tag always;
    }
    location ^~ /socket.io/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Robots-Tag "noindex, follow" always;
    }
    location ^~ /api {
        set $api_upstream api;
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header X-Robots-Tag $api_robots_tag always;
    }
    # Existing verification files and real static files remain accessible.
    # Unknown URLs must be real 404s rather than the SPA home page with status 200.
    location / { try_files $uri =404; }
}
