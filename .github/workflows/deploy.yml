name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'

  deploy-api:
    name: Deploy API
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy API on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/nexopos/nexopos.cl
            git fetch origin
            git checkout main
            git pull origin main
            docker compose -f docker-compose.prod.yml build --no-cache api
            docker rm -f nexopos_api 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d api
            echo "✓ API deployed"

  deploy-web:
    name: Deploy Web
    needs: [changes, deploy-api]
    if: always() && (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch') && needs.deploy-api.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy Web on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 90m
          script: |
            set -e
            cd /home/nexopos/nexopos.cl
            git fetch origin
            git checkout main
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build --no-cache web
            docker rm -f nexopos_web 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d web
            echo "✓ Web deployed"
