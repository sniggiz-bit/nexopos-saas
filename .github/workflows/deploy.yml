name: Deploy to Production

on:
  push:
    branches: [main, 'feature/**', 'release/**']
    paths:
      - 'apps/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.prod.yml'
      - 'scripts/deploy-production.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: nexopos-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release images and focused checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment and recovery procedure
        run: node apps/api/scripts/check-deployment.cjs
      - name: Check local print connector authentication and duplicate protection
        run: node --test apps/print-agent/test.cjs
      - name: Build API production image
        run: docker build -f apps/api/Dockerfile.prod -t nexopos-api-check .
      - name: Build API test image
        run: docker build --target builder -f apps/api/Dockerfile.prod -t nexopos-api-tests .
      - name: Lint changed application files
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then base=HEAD^; else base=$(git merge-base origin/main HEAD); fi
          mapfile -t files < <(git diff --name-only "$base" HEAD -- apps/api/src apps/web/src | grep -E '\.(ts|tsx)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            docker run --rm -w /app -v "$PWD/eslint.config.mjs:/app/eslint.config.mjs:ro" -v "$PWD/apps/web/src:/app/apps/web/src:ro" nexopos-api-tests node node_modules/eslint/bin/eslint.js --config eslint.config.mjs "${files[@]}"
          fi
      - name: Check welcome messages and admin notifications
        run: |
          docker run --rm -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -v "$PWD/apps/web/src:/app/apps/web/src:ro" nexopos-api-tests node scripts/check-admin-notifications.cjs
          docker run --rm -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" nexopos-api-tests npm test -- --runInBand --runTestsByPath src/email/email.service.spec.ts src/email/welcome-emails.service.spec.ts src/auth/auth.service.spec.ts src/tenants/tenants.service.spec.ts src/admin/create-client.controller.spec.ts src/common/registration-rut.service.spec.ts src/common/registration-rut.controller.spec.ts src/users/users.service.spec.ts src/auth/resource-limit.guard.spec.ts src/dte/lioren-integrity.spec.ts src/dte/boleta-pdf.spec.ts src/support/support-assistant.spec.ts
      - name: Check direct thermal printing widths and serial failures
        run: docker run --rm -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -v "$PWD/apps/web/src:/app/apps/web/src:ro" nexopos-api-tests node scripts/check-direct-print.cjs
      - name: Verify NexoPOS boleta and original PDF417 at printer resolution
        run: |
          mkdir -p "$RUNNER_TEMP/client-check-results"
          docker run --rm -u root -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -v "$RUNNER_TEMP/client-check-results:/checks-results" nexopos-api-tests sh -c 'apk add --no-cache poppler-utils font-liberation && node scripts/check-boleta-pdf.cjs && node scripts/check-silent-boleta.cjs'
      - name: Build Web production image
        run: docker build -f apps/web/Dockerfile.prod -t nexopos-web-check .
      - name: Boot release against a disposable database
        run: |
          set -eu
          docker network create release-check
          docker run -d --name release-db --network release-check -e POSTGRES_PASSWORD=isolated-check -e POSTGRES_DB=release_check postgres:15-alpine
          for attempt in $(seq 1 30); do
            docker exec release-db pg_isready -U postgres && break
            sleep 2
          done
          docker exec release-db createdb -U postgres migration_check
          git show 91ab2071918ceeb20c3a642891ad458eb054d87c:apps/api/prisma/schema.prisma > "$RUNNER_TEMP/schema-before.prisma"
          docker run --rm --network release-check -v "$RUNNER_TEMP/schema-before.prisma:/tmp/schema-before.prisma:ro" -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-check prisma db push --schema /tmp/schema-before.prisma --skip-generate
          docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -e NEXOPOS_CLIENT_CHECK=1 -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-tests node scripts/check-client-migration.cjs before
          docker run --rm --network release-check -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-check prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261118060000_client_management/migration.sql
          docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -e NEXOPOS_CLIENT_CHECK=1 -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-tests node scripts/check-client-migration.cjs after
          docker run --rm --network release-check -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-check prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261118070000_lioren_integrity/migration.sql
          docker run --rm --network release-check -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-tests node -e 'const {PrismaClient}=require("@prisma/client"); const p=new PrismaClient(); p.dteSubmission.count().then(n=>{if(n!==0) throw Error("Migration must preserve an empty submission table");}).finally(()=>p.$disconnect());'
          docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -e NEXOPOS_SUPPORT_CHECK=1 -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-tests node scripts/check-support-migration.cjs before
          docker run --rm --network release-check -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-check prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20261119010000_support_assistant/migration.sql
          docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -e NEXOPOS_SUPPORT_CHECK=1 -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/migration_check nexopos-api-tests node scripts/check-support-migration.cjs after
          docker run --rm --network release-check -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/release_check nexopos-api-check prisma db push --skip-generate
          mkdir -p "$RUNNER_TEMP/client-check-uploads" "$RUNNER_TEMP/client-check-results"
          docker run -d --name release-api --network release-check --network-alias api -v "$RUNNER_TEMP/client-check-uploads:/app/uploads" -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/release_check -e JWT_SECRET=isolated-ci-check-secret -e SUPPORT_WORKER_ENABLED=0 -e NODE_ENV=production nexopos-api-check node dist/main.js
          docker run -d --name release-web --network release-check nexopos-web-check
          for attempt in $(seq 1 60); do
            if docker exec release-web wget -q -O /dev/null http://127.0.0.1/api; then break; fi
            sleep 2
          done
          docker exec release-web wget -q -O /dev/null http://127.0.0.1/api
          docker exec release-web wget -q -O /dev/null http://127.0.0.1/
          docker exec release-api node -e 'fetch("http://127.0.0.1:3000/api/support/chat").then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))'
      - name: Check complete client administration and deletion isolation
        run: |
          docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -v "$RUNNER_TEMP/client-check-uploads:/app/uploads" -v "$RUNNER_TEMP/client-check-results:/checks-results" -e NEXOPOS_CLIENT_CHECK=1 -e JWT_SECRET=isolated-ci-check-secret -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/release_check nexopos-api-tests node scripts/check-client-management.cjs
      - name: Check Lioren emission isolation and confirmed credit notes
        run: docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -v "$RUNNER_TEMP/client-check-results:/checks-results" -e NEXOPOS_LIOREN_CHECK=1 -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/release_check nexopos-api-tests node scripts/check-lioren-integrity.cjs
      - name: Check support knowledge, handoff isolation and mail retries
        run: docker run --rm --network release-check -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" -v "$RUNNER_TEMP/client-check-results:/checks-results" -e NEXOPOS_SUPPORT_CHECK=1 -e DATABASE_URL=postgresql://postgres:isolated-check@release-db:5432/release_check nexopos-api-tests node scripts/check-support-assistant.cjs
      - name: Check real client forms and mobile presentation
        run: |
          docker run --rm --network release-check -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright -v "$PWD/apps/api/scripts:/checks:ro" -v "$RUNNER_TEMP/client-check-results:/checks-results" -v "$PWD/apps/web/verify-create-client.cjs:/tmp/create-client-ui.cjs:ro" -v "$PWD/apps/web/verify-registration-rut.cjs:/tmp/registration-rut-ui.cjs:ro" mcr.microsoft.com/playwright:v1.56.1-noble sh -c 'npm install --prefix /tmp/ui-check playwright@1.56.1 --no-audit --no-fund && node /checks/check-client-ui.cjs && NODE_PATH=/tmp/ui-check/node_modules CLIENT_UI_BASE=http://release-web CLIENT_UI_BROWSER=chromium CLIENT_UI_OUTPUT=/checks-results node /tmp/create-client-ui.cjs && NODE_PATH=/tmp/ui-check/node_modules CLIENT_UI_BASE=http://release-web CLIENT_UI_BROWSER=chromium CLIENT_UI_OUTPUT=/checks-results node /tmp/registration-rut-ui.cjs'
      - name: Check Lioren validation and metrics interface with provider fixtures
        run: |
          docker run --rm --network release-check -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright -v "$PWD/apps/api/scripts:/checks:ro" -v "$RUNNER_TEMP/client-check-results:/checks-results" mcr.microsoft.com/playwright:v1.56.1-noble sh -c 'npm install --prefix /tmp/ui-check playwright@1.56.1 --no-audit --no-fund && node /checks/check-lioren-ui.cjs && node /checks/check-internal-checkout-ui.cjs && node /checks/check-local-print-ui.cjs && node /checks/check-credit-note-ui.cjs && node /checks/check-support-ui.cjs'
      - name: Release startup diagnostics
        if: failure()
        run: docker logs release-api 2>&1 || true
      - name: Upload client record previews with fictitious data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-management-preview
          path: ${{ runner.temp }}/client-check-results/*.png
          if-no-files-found: ignore

  deploy:
    name: Build, back up and deploy API and Web
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy the approved commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 110m
          script: |
            set -eu
            cd /home/nexopos/nexopos.cl
            git diff --quiet && git diff --cached --quiet || { echo "El servidor tiene cambios locales versionados; despliegue detenido."; exit 1; }
            previous=$(git rev-parse HEAD)
            git fetch origin main
            git checkout main
            git merge --ff-only ${{ github.sha }}
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            sh scripts/deploy-production.sh ${{ github.sha }} "$previous"
