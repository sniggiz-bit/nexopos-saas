version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexopos-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexopos
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    image: nexopos-api:latest
    container_name: nexopos-api
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/nexopos?schema=public"
      JWT_SECRET: "tu-secreto-super-aleatorio-cambiar-en-produccion-abc123xyz789"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: "production"
      PORT: 3000
      SUPER_ADMIN_EMAIL: "admin@nexopos.cl"
      SUPER_ADMIN_PASSWORD: "Admin123!"
      CORS_ORIGINS: "http://localhost:3001,https://nexopos.cl,https://www.nexopos.cl"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    image: nexopos-web:latest
    container_name: nexopos-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: "http://localhost:4000/api"
      NODE_ENV: "production"
    depends_on:
      - api

volumes:
  postgres_data:
    external: true
    name: nexoposcl_postgres_data
